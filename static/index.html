<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hexploration Editor</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
<a href="/dm.html" style="position:fixed;right:12px;top:12px;z-index:9999">DM Dashboard</a>
    <header>
        <h1>Hexploration Editor</h1>
        <a id="editor-dm-link" href="/dm.html" style="color: white; margin-left: 16px;">DM Dashboard</a>
        <a href="/timeline.html" style="color: white; margin-left: 16px;">Timeline</a>
        <a href="/player.html" style="color: white; margin-left: 16px;">Player map</a>
    </header>
    <section id="campaign-save-panel" class="editor-campaign-panel hidden">
      <div><strong id="editor-campaign-name">Campagne</strong><span id="editor-campaign-context">Contexte MJ</span></div>
      <label>Nom de la carte<input id="persist-map-name" value="Carte principale" maxlength="160"></label>
      <label>Version<input id="persist-version-name" value="Initial version" maxlength="160"></label>
      <label>Effective à m.<input id="persist-effective-minute" type="number" min="0" value="0"></label>
      <button id="persist-map-btn" type="button">Persister dans la campagne</button>
      <span id="persist-map-message"></span>
    </section>
    <div id="canvas-section">
        <nav id="tool-bar">
        <a href="/dashboard.html">Dashboard</a>
            <button id="load-map-btn">Load map</button>
            <button id="new-map-btn">New Map</button>
            <button id="paint-map-btn">"Paint"</button>
            <button id="brush-btn">Brush</button>
            <button id="bucket_btn">Bucket</button>
            <div class="radius-slider-contener">
                <input type="range" min="1" max="10" value="1" class="slider" id="radius-slider">
                <span id="radius-slider-value">1</span>
            </div>
            <div id="terrain-buttons"></div>
        </nav>
        <canvas id="hex-canvas" width="1000" height="600"></canvas>
        <div id="new-map-modal" class="modal hidden">
            <div class="modal-content">
                <h2>New Map</h2>
                <label>Width</label>
                <input id="new-map-width" type="number" value="20">
                <label>Height</label>
                <input id="new-map-height" type="number" value="20">
                <label>Hex size</label>
                <input id="new-map-hex-size" type="number" value="32">
                <button id="confirm-new-map-btn">Create</button>
                <button id="cancel-new-map-btn">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
